    <style>
        :root {
            --font-display: 'Syne', sans-serif;
            --font-editorial: 'Cormorant Garamond', serif;

        }

        body {
            background-color: #060608;
            color: #f4f4f5;
            font-family: var(--font-display);
            overflow-x: hidden;
        }

        .font-display { font-family: var(--font-display); }
        .font-editorial { font-family: var(--font-editorial); }
        .font-utility { font-family: var(--font-utility); }

        /* Ambient background mesh with subtle lighting */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 15, 20, 0.8) 0%, #060608 100%);
        }

        /* Technical grid overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            opacity: 0.05;
            background-image: linear-gradient(to right, #ffffff 1px, transparent 1px),
                              linear-gradient(to bottom, #ffffff 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* High-contrast Glassmorphism panel */
        .glass-panel {
            background: rgba(18, 18, 24, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .glass-nav {

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Scroll animations */
        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-magnetic {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
        }
        .btn-magnetic:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -5px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>

        const useScrollReveal = () => {
          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(
              ([entry]) => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                  if (ref.current) observer.unobserve(ref.current);
                }
              },
              { threshold: 0.12 }
            );

            if (ref.current) observer.observe(ref.current);
            return () => { if (ref.current) observer.unobserve(ref.current); };
          }, []);

          return [ref, isVisible];
        };

                  <div className="hidden md:block absolute top-1/2 left-0 w-full h-px bg-white/30 -z-10"></div>
                  
                  {steps.map((step, idx) => (
                    <div key={idx} className="flex flex-col items-center md:items-start text-center md:text-left group relative bg-[#060608] p-4">
                       <div className="w-12 h-12 rounded-full bg-zinc-900 border border-white/50 flex items-center justify-center font-utility text-xs font-bold text-zinc-100 mb-6 group-hover:border-indigo-400 group-hover:text-indigo-400 transition-colors">
                        0{idx + 1}
                       </div>
                       <h3 className="font-display font-bold text-3xl md:text-4xl tracking-tighter text-white group-hover:-translate-y-2 transition-transform duration-300">
                         {step}
                       </h3>
                       {idx !== steps.length - 1 && (
                         <div className="md:hidden w-px h-12 bg-white/30 mt-6"></div>
                       )}
                    </div>
                  ))}
                </div>
              </div>
            </section>
          );
        };

        const CoursesPage = () => {
          useEffect(() => { window.scrollTo(0, 0); }, []);
          
          return (
            <div className="pt-36 px-6 md:px-12 min-h-screen">
              <div className="max-w-7xl mx-auto">
                <header className="mb-20">
                  <span className="font-utility text-xs font-bold tracking-widest text-indigo-400 uppercase block mb-4">OPEN ACCESS</span>
                  <h1 className="font-display font-black text-5xl md:text-8xl tracking-tighter text-white uppercase mb-6">
                    Library
                  </h1>
                  <p className="font-editorial text-2xl md:text-3xl text-zinc-100 max-w-2xl">
                    Practical modules designed to build real capability. Start anywhere.
                  </p>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-32">
                  {CONFIG.courses.map((course, idx) => (
                    <div key={course.id} className="glass-panel p-8 md:p-12 rounded-[2rem] flex flex-col group hover:border-indigo-500/60 transition-all duration-300">
                      <div className="flex justify-between items-center mb-12">
                         <span className="font-display text-4xl font-bold text-white/50 group-hover:text-white transition-colors">0{idx + 1}</span>
                         <span className={`font-utility text-xs font-bold tracking-widest border px-4 py-1.5 rounded-full ${course.status === 'AVAILABLE' ? 'border-emerald-400/80 text-emerald-300 bg-emerald-500/20' : 'border-white/40 text-zinc-300 bg-white/10'}`}>
                            {course.status}
                         </span>
                      </div>
                      
                      <div className="mt-auto">
                        <span className="font-utility text-xs font-bold tracking-widest text-indigo-300 mb-2 block uppercase">{course.category}</span>
                        <h2 className="font-display font-black text-3xl md:text-4xl tracking-tight text-white mb-4">
                          {course.title}
                        </h2>
                        <p className="font-editorial text-xl text-zinc-200 mb-8 max-w-md">
                          {course.desc}
                        </p>
                        
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between border-t border-white/20 pt-6 gap-4">
                          <div className="font-utility text-xs font-bold text-zinc-300 flex gap-6">
                            <span>{course.modules} MODULES</span>
                            <span>100% FREE</span>
                          </div>

                          {course.link ? (
                            <a 
                              href={course.link}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-6 py-3 bg-white text-zinc-950 font-utility text-xs tracking-widest rounded-full hover:bg-indigo-300 transition-colors font-extrabold text-center flex items-center justify-center gap-2 shadow-lg"
                            >
                              START PLAYLIST <ExternalLinkIcon />
                            </a>
                          ) : (
                            <button className="px-6 py-3 bg-white/10 text-zinc-400 font-utility text-xs tracking-widest rounded-full font-bold cursor-not-allowed text-center" disabled>
                              COMING SOON
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const AboutPage = () => {
          useEffect(() => { window.scrollTo(0, 0); }, []);
          const [imageLoaded, setImageLoaded] = useState(false);

          return (
            <div className="pt-36 px-6 md:px-12 min-h-screen">
              <div className="max-w-6xl mx-auto">
                
                {/* Founder Card with Symbol Art Frame */}
                <section className="mb-24">
                  <div className="glass-panel p-8 md:p-14 rounded-[2.5rem] relative overflow-hidden grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                    <div className="absolute -top-32 -right-32 w-80 h-80 bg-indigo-500/20 blur-[100px] rounded-full pointer-events-none"></div>
                    
                    {/* Left Column: Image Frame */}
                    <div className="lg:col-span-5 relative group">
                      <div className="absolute -top-3 -left-3 font-utility text-[10px] text-indigo-400 tracking-widest uppercase select-none z-20 bg-black/90 px-2 py-0.5 border border-white/20">
                        ┌─[ REF:FOUNDER.01 ]─┐
                      </div>
                      <div className="absolute -bottom-3 -right-3 font-utility text-[10px] text-indigo-400 tracking-widest uppercase select-none z-20 bg-black/90 px-2 py-0.5 border border-white/20">
                        └─[ AGLA PAG ]─┘
                      </div>

                      <div className="relative rounded-2xl overflow-hidden border border-white/30 bg-zinc-900 aspect-[4/5] shadow-2xl">
                        <img 
                          src={CONFIG.content.founder.photoUrl} 
                          alt={CONFIG.content.founder.name}
                          onLoad={() => setImageLoaded(true)}
                          className={`w-full h-full object-cover object-center grayscale contrast-125 group-hover:grayscale-0 transition-all duration-700 ease-out ${imageLoaded ? 'opacity-100 scale-100' : 'opacity-0 scale-105'}`}
                          onError={(e) => {
                            e.target.onerror = null; 
                            e.target.src = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop";
                          }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                        
                        <div className="absolute bottom-4 left-4 right-4 bg-black/70 backdrop-blur-md p-3 rounded-xl border border-white/20 flex justify-between items-center">
                          <span className="font-utility text-[11px] font-bold tracking-widest text-zinc-100">
                            + {CONFIG.content.founder.name}
                          </span>
                          <span className="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-ping"></span>
                        </div>
                      </div>
                    </div>

                    {/* Right Column: Founder Intro */}
                    <div className="lg:col-span-7 relative z-10 flex flex-col justify-center">
                      <span className="font-utility text-xs font-bold tracking-widest text-indigo-400 mb-4 block uppercase">
                        [ FOUNDER STATEMENT ]
                      </span>
                      <h1 className="font-display font-black text-4xl md:text-6xl tracking-tighter text-white mb-3 uppercase">
                        {CONFIG.content.founder.name}
                      </h1>
                      <p className="font-utility text-xs font-bold tracking-widest text-indigo-300 uppercase mb-8">
                        {CONFIG.content.founder.role}
                      </p>

                      <h2 className="font-editorial italic text-2xl md:text-3xl text-zinc-100 mb-6 font-normal">
                        "{CONFIG.content.founder.storyHeading}"
                      </h2>

                      <div className="flex gap-4">
                         <a href={CONFIG.urls.youtubeChannel} target="_blank" rel="noopener noreferrer" className="w-12 h-12 rounded-full border border-white/40 flex items-center justify-center text-zinc-200 hover:text-white hover:border-white transition-all btn-magnetic">
                           <YoutubeIcon className="w-5 h-5" />
                         </a>
                         <a href="#" className="w-12 h-12 rounded-full border border-white/40 flex items-center justify-center text-zinc-200 hover:text-white hover:border-white transition-all btn-magnetic">
                           <TwitterIcon className="w-5 h-5" />
                         </a>
                      </div>
                    </div>
                  </div>
                </section>

                {/* Founder Story Section */}
                <section className="py-12 mb-24 border-t border-white/20 pt-16">
                   <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                     <div className="lg:col-span-4">
                       <span className="font-utility text-xs font-bold tracking-widest text-indigo-300 block mb-3 uppercase">
                         OUR MOTTO & STORY
                       </span>
                       <h3 className="font-display font-bold text-3xl md:text-4xl tracking-tight text-white leading-tight">
                         Why AGLA PAG Exists
                       </h3>
                       <div className="w-16 h-1 bg-indigo-500 mt-6 rounded-full"></div>
                     </div>

                     <div className="lg:col-span-8 font-editorial text-xl md:text-2xl text-zinc-200 leading-relaxed space-y-6">
                        {CONFIG.content.founder.story.map((paragraph, index) => (
                          <p key={index} className="first-letter:text-4xl first-letter:font-display first-letter:font-bold first-letter:text-indigo-400">
                            {paragraph}
                          </p>
                        ))}
                     </div>
                   </div>
                </section>
                
                {/* Call to Join */}
                <section className="text-center py-20 border border-white/20 glass-panel rounded-[2rem] my-16">
                   <h2 className="font-display font-black text-4xl md:text-6xl tracking-tighter text-white uppercase mb-6">
                     BUILD THE NEXT STEP.
                   </h2>
                   <p className="font-editorial text-2xl text-zinc-100 max-w-xl mx-auto mb-8">
                     Help us make practical knowledge free for everyone. Join the movement today.
                   </p>
                   <a href={CONFIG.urls.joinForm} target="_blank" rel="noopener noreferrer" 
                      className="inline-block px-10 py-5 bg-white text-zinc-950 font-utility text-xs font-extrabold tracking-widest rounded-full hover:bg-indigo-300 transition-all btn-magnetic shadow-xl">
                     JOIN THE MOVEMENT
                   </a>
                </section>

              </div>
            </div>
          );
        };

        const Footer = ({ setView }) => {
          return (
            <footer className="mt-auto border-t border-white/20 bg-zinc-950 py-16 px-6 md:px-12 relative z-10">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
                <div>
                  <span className="font-display font-black text-2xl text-white block">AGLA PAG</span>
                  <span className="font-utility text-xs font-bold text-indigo-300 tracking-widest uppercase">THE NEXT STEP</span>
                </div>

                <div className="flex gap-8">
                  {['home', 'courses', 'about'].map((view) => (
                    <button
                      key={view}
                      onClick={() => setView(view)}
                      className="font-utility text-xs font-bold text-zinc-300 hover:text-white uppercase tracking-widest"
                    >
                      {view}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-4">
                  <a
                    href={CONFIG.urls.contactForm}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="font-utility text-xs font-bold text-indigo-400 hover:underline tracking-widest uppercase"
                  >
                    CONTACT US
                  </a>
                </div>
              </div>
              
              <div className="max-w-7xl mx-auto mt-12 pt-8 border-t border-white/10 text-center md:text-left">
                <p className="font-utility text-[11px] font-bold text-zinc-400 tracking-widest uppercase">
                  © {new Date().getFullYear()} AGLA PAG. ALL RIGHTS RESERVED.
                </p>
              </div>
            </footer>
          );
        };

        function App() {
          const [currentView, setCurrentView] = useState('home');

          const renderView = () => {
            switch(currentView) {
              case 'home':
                return (
                  <>
                    <HeroSection setView={setCurrentView} />
                    <MovementCounter />
                    <FeaturedVideo />
                    <MissionSection />
                    <CoursePreviewSection setView={setCurrentView} />
                    <LearningPhilosophy />
                    
                    {/* Fixed High Contrast Call to Action Section */}
                    <section className="py-28 px-6 text-center relative z-10">
                      <div className="max-w-4xl mx-auto glass-panel p-12 md:p-20 rounded-[2.5rem]">
                        <h2 className="font-display font-black text-4xl md:text-6xl tracking-tighter text-white mb-8 drop-shadow-md">
                          YOUR NEXT STEP STARTS HERE.
                        </h2>
                        <a 
                          href={CONFIG.urls.joinForm} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="inline-block px-10 py-5 bg-white text-zinc-950 font-utility text-xs font-extrabold tracking-widest rounded-full hover:bg-indigo-300 transition-all btn-magnetic shadow-2xl"
                        >
                          JOIN THE MOVEMENT
                        </a>
                      </div>
                    </section>
                  </>
                );
              case 'courses': return <CoursesPage />;
              case 'about': return <AboutPage />;
              default: return <HeroSection setView={setCurrentView} />;
            }
          };

          return (
            <div className="min-h-screen relative flex flex-col bg-[#060608]">
              <div className="ambient-bg"></div>
              <div className="noise-overlay"></div>
              
              <Navigation currentView={currentView} setView={setCurrentView} />
              
              <main className="flex-grow flex flex-col justify-start">
                {renderView()}
              </main>

              <Footer setView={setCurrentView} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="animations.js" defer></script>
</body>
</html>
